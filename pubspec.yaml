name: itfits
description: AI Interior Design Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  equatable: ^3.0.0
  cached_network_image: ^4.0.3
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  permission_handler: ^13.0.2
  flutter_svg: ^2.0.10+1
  google_fonts: ^8.0.0
  shimmer: ^4.0.0
  flutter_animate: ^4.5.0
  collection: ^1.18.0
  uuid: ^4.3.3
  path: ^1.9.0
  image: ^4.1.7
  http: ^1.2.0
  panorama_viewer: ^2.0.7
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  flutter_image_compress: ^2.3.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  intl_utils: ^2.8.0
  camera: ^0.12.1
  wakelock_plus: ^1.8.1
  dchs_motion_sensors: ^2.0.2
  flutter_dotenv: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  freezed: ^4.0.1
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon.png
    - assets/images/logo.png
    - .env